<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<style>
  :root{
    --bg:#fff; --surface:#f6f7f9; --text:#14181f; --muted:#5b6472;
    --border:#e3e6ea; --accent:#1a4d8f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1117; --surface:#161b22; --text:#e6edf3; --muted:#8b949e;
      --border:#262c36; --accent:#6aa3e0;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 20px 64px;
    background:var(--bg); color:var(--text);
    font:16px/1.75 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    max-width:720px; margin-inline:auto;
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:22px; line-height:1.4; margin:0 0 4px}
  .updated{color:var(--muted); font-size:13px; margin:0 0 28px}
  h2{font-size:17px; margin:32px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--border)}
  p,li{overflow-wrap:anywhere}
  ul{padding-left:1.25em; margin:8px 0}
  a{color:var(--accent)}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin:12px 0}
  .empty{color:var(--muted)}
  footer{margin-top:48px; padding-top:16px; border-top:1px solid var(--border); font-size:14px}
  footer ul{list-style:none; padding:0}
  footer li{margin:4px 0}
</style>
</head>
<body>
  <h1>Daily Brief</h1>
  <p class="updated">まだ生成されていません</p>
  <div class="card empty">
    Routine の初回実行が終わると、このページが最新のレポートに置き換わります。
  </div>
  <footer>
    <strong>過去のレポート</strong>
    <ul><li class="empty">なし</li></ul>
  </footer>
</body>
</html>
